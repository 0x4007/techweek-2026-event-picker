name: Deno Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DENO_DEPLOY_ORG: "0x4007"
      DENO_DEPLOY_APP: techweek-2026-event-picker
      DENO_DEPLOY_REGION: us
      DEPLOY_ROOT: /tmp/techweek-deploy-root
      ENTRYPOINT: app/main.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Show tool versions
        run: deno --version

      - name: Prepare deploy root
        run: scripts/prepare_deno_deploy_root.sh "$DEPLOY_ROOT"

      - name: Validate deploy root
        working-directory: ${{ env.DEPLOY_ROOT }}
        run: deno task check

      - name: Detect deploy changes
        id: deploy_changes
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/deno-deploy\.yml|app/|outputs/signed_up/|data/rankings/techweek_nyc_accolades_full_rerank|docs/agenda/TECHWEEK_AGENDA\.md|docs/handoffs/|docs/text-conversation-rewards/|deno\.json|deno\.lock|README\.md|scripts/(prepare_deno_deploy_root_test|snapshot_text_conversation_rewards)\.ts|scripts/prepare_deno_deploy_root\.sh)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Deno app exists
        if: steps.deploy_changes.outputs.deploy == 'true'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DENO_DEPLOY_TOKEN:-}" ]; then
            echo "::error::DENO_DEPLOY_TOKEN repo secret is required"
            exit 1
          fi

          set +e
          probe_output="$(deno deploy env list --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1)"
          probe_status=$?
          set -e

          if [ "$probe_status" -eq 0 ]; then
            echo "Deno Deploy app $DENO_DEPLOY_APP already exists."
            exit 0
          fi

          if ! printf '%s\n' "$probe_output" | grep -qi "not found"; then
            echo "$probe_output"
            exit "$probe_status"
          fi

          deno deploy create \
            --token "$DENO_DEPLOY_TOKEN" \
            --org "$DENO_DEPLOY_ORG" \
            --app "$DENO_DEPLOY_APP" \
            --source local \
            --do-not-use-detected-build-config \
            --app-directory . \
            --runtime-mode dynamic \
            --entrypoint "$ENTRYPOINT" \
            --working-directory . \
            --install-command true \
            --build-command true \
            --pre-deploy-command true \
            --build-timeout 5 \
            --build-memory-limit 1024 \
            --region "$DENO_DEPLOY_REGION" \
            --no-wait \
            "$DEPLOY_ROOT"

      - name: Ensure Deno KV database is assigned
        if: steps.deploy_changes.outputs.deploy == 'true'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          database_name="${DENO_DEPLOY_APP}-kv"

          set +e
          provision_output="$(deno deploy database provision "$database_name" --kind denokv --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" 2>&1)"
          provision_status=$?
          set -e
          if [ "$provision_status" -ne 0 ] && printf '%s\n' "$provision_output" | grep -Eqi 'limit|already|exist'; then
            list_output="$(deno deploy database list --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" 2>&1)"
            existing_database_name="$(printf '%s\n' "$list_output" | awk -F '│' 'tolower($0) ~ /denokv/ { name = $2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", name); print name; exit }')"
            if [ -z "$existing_database_name" ]; then
              existing_database_name="$(printf '%s\n' "$list_output" | awk 'tolower($0) ~ /denokv/ { print $1; exit }')"
            fi
            if [ -z "$existing_database_name" ]; then
              echo "$provision_output"
              echo "$list_output"
              exit "$provision_status"
            fi
            database_name="$existing_database_name"
          elif [ "$provision_status" -ne 0 ]; then
            echo "$provision_output"
            exit "$provision_status"
          fi
          echo "$provision_output"

          set +e
          assign_output="$(deno deploy database assign "$database_name" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1)"
          assign_status=$?
          set -e
          if [ "$assign_status" -ne 0 ] && ! printf '%s\n' "$assign_output" | grep -Eqi 'already|assigned|exist'; then
            echo "$assign_output"
            exit "$assign_status"
          fi
          echo "$assign_output"

      - name: Deploy to Deno Deploy
        if: steps.deploy_changes.outputs.deploy == 'true'
        working-directory: ${{ env.DEPLOY_ROOT }}
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          deno deploy \
            --token "$DENO_DEPLOY_TOKEN" \
            --config deno.json \
            --org "$DENO_DEPLOY_ORG" \
            --app "$DENO_DEPLOY_APP" \
            --prod \
            .

      - name: Dump Deno Deploy logs on deploy failure
        if: failure() && steps.deploy_changes.outputs.deploy == 'true'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          start="$(date -u -d '10 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          deno deploy logs \
            --token "$DENO_DEPLOY_TOKEN" \
            --org "$DENO_DEPLOY_ORG" \
            --app "$DENO_DEPLOY_APP" \
            --start "$start" || true

      - name: Verify deployment
        run: |
          set -euo pipefail
          base_url="https://${DENO_DEPLOY_APP}.${DENO_DEPLOY_ORG}.deno.net"
          expected_app_js_sha="$(sha256sum "$DEPLOY_ROOT/app/static/app.js" | awk '{print $1}')"
          for attempt in $(seq 1 60); do
            app_js_tmp="$(mktemp)"
            if curl -fsSL "$base_url/" | grep -q 'data-chat-share' &&
              curl -fsSL "$base_url/api/health" | grep -q '"status": "ready"' &&
              curl -fsSL "$base_url/app.js" -o "$app_js_tmp" &&
              [ "$(sha256sum "$app_js_tmp" | awk '{print $1}')" = "$expected_app_js_sha" ]; then
              rm -f "$app_js_tmp"
              exit 0
            fi
            rm -f "$app_js_tmp"
            sleep 5
          done
          curl -fsSL "$base_url/" | grep -n 'data-chat-share' || true
          curl -fsSL "$base_url/api/health" || true
          curl -fsSL "$base_url/app.js" -o /tmp/live-app.js || true
          printf 'Expected app.js sha: %s\n' "$expected_app_js_sha"
          [ -f /tmp/live-app.js ] && sha256sum /tmp/live-app.js || true
          exit 1
