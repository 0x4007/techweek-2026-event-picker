<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)">
    <title>Planning Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="planner">
    <svg aria-hidden="true" width="0" height="0" style="position: absolute">
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <path
          d="M7 3v3M17 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"
        />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m20 6-11 11-5-5" />
      </symbol>
      <symbol id="icon-file-up" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
        <path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3" />
      </symbol>
      <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M21 12a7 7 0 0 1-7 7H8l-5 3 2-5a7 7 0 1 1 16-5Z" />
      </symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="M22 2 11 13" />
        <path d="m22 2-7 20-4-9-9-4 20-7Z" />
      </symbol>
      <symbol id="icon-sparkles" viewBox="0 0 24 24">
        <path d="m12 3 1.7 5.2L19 10l-5.3 1.8L12 17l-1.7-5.2L5 10l5.3-1.8L12 3Z" />
        <path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 11v6M14 11v6" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
    </svg>

    <header>
      <section>
        <p>Planning Agent</p>
        <h1>Calendar Builder</h1>
      </section>
      <nav aria-label="Workspace sections">
        <button type="button" data-panel-button="calendar" aria-current="page">
          <svg><use href="#icon-calendar"></use></svg><span>Calendar</span>
        </button>
        <button type="button" data-panel-button="sources">
          <svg><use href="#icon-file-up"></use></svg><span>Sources</span>
        </button>
        <button type="button" data-panel-button="profile">
          <svg><use href="#icon-user"></use></svg><span>Profile</span>
        </button>
      </nav>
      <button type="button" data-account-button>
        <svg><use href="#icon-user"></use></svg><span data-account-label>Sign in</span>
      </button>
    </header>

    <main>
      <section data-auth-gate hidden>
        <h2>Continue with passkey</h2>
        <menu>
          <button type="button" data-auth-open>Continue</button>
        </menu>
      </section>

      <section data-shell hidden>
        <section data-agent-popover data-collapsed="false">
          <button
            type="button"
            data-agent-pill
            data-agent-toggle
            aria-label="Open agent"
            aria-expanded="false"
          >
            <svg><use href="#icon-message"></use></svg><span>Agent</span>
          </button>
          <section data-agent-panel>
            <header data-agent-bar>
              <section>
                <p>Agent</p>
                <h2>Calendar assistant</h2>
              </section>
              <button
                type="button"
                data-agent-toggle
                aria-label="Minimize agent"
                aria-expanded="true"
              >
                <svg><use href="#icon-minus"></use></svg>
              </button>
            </header>
            <section data-plan-strip>
              <article>
                <p>Events</p>
                <strong data-count-events>0</strong>
              </article>
              <article>
                <p>Selected</p>
                <strong data-count-selected>0</strong>
              </article>
              <article>
                <p>Logistics</p>
                <strong data-count-logistics>0</strong>
              </article>
            </section>
            <section data-agenda-history>
              <header>
                <h3>Generated agendas</h3>
                <p data-agenda-status></p>
              </header>
              <label data-agenda-rename>
                <span>Agenda name</span>
                <input data-agenda-name autocomplete="off" placeholder="No saved agenda">
              </label>
              <section data-agenda-list></section>
            </section>
            <section data-chat-log aria-live="polite"></section>
            <form data-chat-form>
              <textarea
                name="prompt"
                rows="3"
                autocomplete="off"
                placeholder="Ask the agent to plan a day, compare tradeoffs, or adjust priorities."
              ></textarea>
              <button type="submit" aria-label="Send">
                <svg><use href="#icon-send"></use></svg>
              </button>
            </form>
          </section>
        </section>

        <section data-panel="calendar" hidden>
          <section data-calendar-header>
            <h2>Calendar</h2>
          </section>
          <section data-calendar></section>
        </section>

        <section data-panel="sources" hidden>
          <section data-source-grid>
            <form data-import-form>
              <h2>Sources</h2>
              <label>
                <span>Name</span>
                <input name="name" autocomplete="off" placeholder="Conference events">
              </label>
              <label>
                <span>Type</span>
                <select name="sourceType">
                  <option value="csv">CSV</option>
                  <option value="text">Text</option>
                </select>
              </label>
              <label data-file-control>
                <span>File</span>
                <input name="file" type="file" accept=".csv, .txt, text/csv, text/plain">
              </label>
              <label>
                <span>Data</span>
                <textarea
                  name="sourceText"
                  rows="12"
                  placeholder="title,start,end,location&#10;Demo Day,2026-06-01 10:00,2026-06-01 11:00,Main Hall"
                ></textarea>
              </label>
              <button type="submit">
                <svg><use href="#icon-file-up"></use></svg><span>Import</span>
              </button>
            </form>
            <section data-import-list></section>
          </section>
        </section>

        <section data-panel="profile" hidden>
          <form data-profile-form>
            <h2>Profile</h2>
            <label>
              <span>Name</span>
              <input name="displayName" autocomplete="name">
            </label>
            <label>
              <span>Home base</span>
              <input name="homeBase" autocomplete="street-address">
            </label>
            <section data-two-col>
              <label>
                <span>Time zone</span>
                <input name="timeZone" autocomplete="off">
              </label>
              <label>
                <span>Travel buffer</span>
                <input name="defaultTravelMinutes" type="number" min="1" step="1">
              </label>
            </section>
            <label>
              <span>Preferences</span>
              <textarea name="preferencePrompt" rows="5"></textarea>
            </label>
            <label>
              <span>Priorities</span>
              <textarea name="priorityPrompt" rows="5"></textarea>
            </label>
            <label>
              <span>Logistics</span>
              <textarea name="logisticsPrompt" rows="4"></textarea>
            </label>
            <p data-profile-status></p>
          </form>
        </section>
      </section>
    </main>

    <section data-event-editor-backdrop hidden></section>
    <aside
      data-event-editor
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="event-editor-title"
    >
      <form data-event-form>
        <header>
          <h2 id="event-editor-title" data-event-editor-title>Event</h2>
          <button type="button" data-event-editor-close aria-label="Close">
            <svg><use href="#icon-x"></use></svg>
          </button>
        </header>
        <input type="hidden" name="id">
        <label>
          <span>Title</span>
          <input name="title" autocomplete="off" required>
        </label>
        <section data-two-col>
          <label>
            <span>Start</span>
            <input name="start" type="datetime-local" required>
          </label>
          <label>
            <span>End</span>
            <input name="end" type="datetime-local" required>
          </label>
        </section>
        <label>
          <span>Location</span>
          <input name="location" autocomplete="off">
        </label>
        <label>
          <span>Notes</span>
          <textarea name="description" rows="4"></textarea>
        </label>
        <menu>
          <button type="button" data-event-editor-close>Cancel</button>
          <button type="submit">
            <svg><use href="#icon-check"></use></svg><span data-event-submit-label>Save</span>
          </button>
        </menu>
      </form>
    </aside>

    <script type="module" src="/app.js"></script>
  </body>
</html>
