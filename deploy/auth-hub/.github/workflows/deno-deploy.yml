name: Deno Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DENO_DEPLOY_ORG: "0x4007"
      DENO_DEPLOY_APP: deno-universal-auth
      DENO_DEPLOY_REGION: us
      ENTRYPOINT: main.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check
        run: deno task check

      - name: Ensure Deno app exists
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DENO_DEPLOY_TOKEN:-}" ]; then
            echo "::error::DENO_DEPLOY_TOKEN repo or org secret is required"
            exit 1
          fi

          set +e
          probe_output="$(deno deploy env list --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1)"
          probe_status=$?
          set -e

          if [ "$probe_status" -eq 0 ]; then
            echo "Deno Deploy app $DENO_DEPLOY_APP already exists."
            exit 0
          fi

          if ! printf '%s\n' "$probe_output" | grep -qi "not found"; then
            echo "$probe_output"
            exit "$probe_status"
          fi

          deno deploy create \
            --token "$DENO_DEPLOY_TOKEN" \
            --org "$DENO_DEPLOY_ORG" \
            --app "$DENO_DEPLOY_APP" \
            --source local \
            --do-not-use-detected-build-config \
            --app-directory . \
            --runtime-mode dynamic \
            --entrypoint "$ENTRYPOINT" \
            --working-directory . \
            --install-command true \
            --build-command true \
            --pre-deploy-command true \
            --build-timeout 5 \
            --build-memory-limit 1024 \
            --region "$DENO_DEPLOY_REGION" \
            --no-wait \
            .

      - name: Ensure Deno KV database is assigned
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          database_name="${DENO_DEPLOY_APP}-kv"

          set +e
          provision_output="$(deno deploy database provision "$database_name" --kind denokv --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" 2>&1)"
          provision_status=$?
          set -e
          if [ "$provision_status" -ne 0 ] && printf '%s\n' "$provision_output" | grep -Eqi 'limit|already|exist'; then
            list_output="$(deno deploy database list --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" 2>&1)"
            existing_database_name="$(printf '%s\n' "$list_output" | awk -F '│' 'tolower($0) ~ /denokv/ { name = $2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", name); print name; exit }')"
            if [ -z "$existing_database_name" ]; then
              existing_database_name="$(printf '%s\n' "$list_output" | awk 'tolower($0) ~ /denokv/ { print $1; exit }')"
            fi
            if [ -z "$existing_database_name" ]; then
              echo "$provision_output"
              echo "$list_output"
              exit "$provision_status"
            fi
            database_name="$existing_database_name"
          elif [ "$provision_status" -ne 0 ]; then
            echo "$provision_output"
            exit "$provision_status"
          fi
          echo "$provision_output"

          set +e
          assign_output="$(deno deploy database assign "$database_name" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP" 2>&1)"
          assign_status=$?
          set -e
          if [ "$assign_status" -ne 0 ] && ! printf '%s\n' "$assign_output" | grep -Eqi 'already|assigned|exist'; then
            echo "$assign_output"
            exit "$assign_status"
          fi
          echo "$assign_output"

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          deno deploy \
            --token "$DENO_DEPLOY_TOKEN" \
            --config deno.json \
            --org "$DENO_DEPLOY_ORG" \
            --app "$DENO_DEPLOY_APP" \
            --prod \
            .

      - name: Verify deployment
        run: |
          set -euo pipefail
          base_url="https://${DENO_DEPLOY_APP}.${DENO_DEPLOY_ORG}.deno.net"
          for attempt in $(seq 1 60); do
            if curl -fsSL "$base_url/api/health" | grep -q '"status": "healthy"'; then
              exit 0
            fi
            sleep 5
          done
          curl -fsSL "$base_url/api/health" || true
          exit 1
